[platformio]
src_dir = OLED_SCREEN_TEST/src

[env:promicro_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_promicrorp2040
framework = arduino
board_build.core = earlephilhower
; Must match Tools > Flash Size in the Arduino IDE, or LittleFS (your saved state) gets wiped
board_build.filesystem_size = 64k
monitor_speed = 115200
; Copy the UF2 to the RPI-RP2 drive like the Arduino IDE does (picotool needs a WinUSB driver on Windows)
upload_protocol = mbed
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SH110X@^2.1.15
    adafruit/Adafruit BusIO@^1.17.4
    bblanchon/ArduinoJson@^7.4.3